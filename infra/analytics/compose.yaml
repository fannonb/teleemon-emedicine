services:
  metabase-app-db:
    image: ${METABASE_APP_POSTGRES_IMAGE:?Set a reviewed, pinned PostgreSQL image}
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase_app
      POSTGRES_PASSWORD: ${METABASE_APP_DB_PASSWORD:?Set a local secret outside source control}
    volumes:
      - metabase_app_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase_app -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase:
    image: ${METABASE_IMAGE:?Set a reviewed, pinned Metabase image}
    restart: unless-stopped
    depends_on:
      metabase-app-db:
        condition: service_healthy
    ports:
      - "${METABASE_BIND_ADDRESS:-127.0.0.1}:3030:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-app-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase_app
      MB_DB_PASS: ${METABASE_APP_DB_PASSWORD:?Set a local secret outside source control}
      MB_JETTY_HOST: 0.0.0.0

volumes:
  metabase_app_data:
